<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presença Confirmada! | Chá do Dominic ✈️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-principal: #3b82f6;
            --azul-escuro: #1a365d;
            --bege-suave: #fdfbf7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bege-suave);
            color: var(--azul-escuro);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-obrigado {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(26, 54, 93, 0.08);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            color: var(--azul-escuro);
            margin-bottom: 12px;
        }

        p {
            font-size: 1.05rem;
            color: #556987;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-voltar {
            display: inline-block;
            width: 100%;
            background-color: var(--azul-principal);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .btn-voltar:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }
    </style>
</head>
<body>

    <div class="card-obrigado">
        <div class="icon-container">
            ✈️
        </div>
        <h1>Presença Registrada!</h1>
        <p>Muito obrigado por responder! Mal podemos esperar para comemorar esse momento tão especial do Chá do Dominic com você! 🎉💙</p>
        <a href="index.html" class="btn-voltar">← Voltar ao site</a>
    </div>

</body>
</html>
